<!doctype html><html lang="en"><meta charset="utf-8"><title>Blind One — limp review</title>
<style>body{margin:0;background:#151719;color:#eee;font:16px system-ui;display:grid;place-items:center}main{max-width:760px;text-align:center;padding:20px}img{height:72vh;max-width:100%;object-fit:contain}button,input{margin:12px}p{color:#bbc1c6}button{padding:10px 20px;border:0;border-radius:6px;cursor:pointer}</style>
<main><h2>Blind One · rigged motion review</h2><img id="frame" src="frame_001.png" alt="Rendered rigged Blind One animation"><br><button id="play">Pause</button><label>Frame <input id="scrub" type="range" min="0" max="23" value="0"></label><p>Separate V5 review copy. Current game and AI are unchanged.<br>Right foot drags; the other foot lifts. Scrub to inspect the hands and feet.</p></main>
<script>let i=0,playing=true;const img=document.querySelector('#frame'),slider=document.querySelector('#scrub'),button=document.querySelector('#play');function show(){img.src='frame_'+String(i*2+1).padStart(3,'0')+'.png';slider.value=i}button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play'};slider.oninput=()=>{playing=false;button.textContent='Play';i=+slider.value;show()};setInterval(()=>{if(playing){i=(i+1)%24;show()}},1000/12);</script></html>
